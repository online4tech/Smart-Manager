name: Smart Manager CI

on:
  push:
    branches: ["feature/receiver-readonly-webif"]
  pull_request:
    branches: ["main", "feature/bridge-pairing-ui"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build application
        run: npm run build
