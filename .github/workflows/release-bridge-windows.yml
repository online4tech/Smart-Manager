name: Release Online4Tech Windows Bridge

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run bridge tests
        run: python -m unittest discover -s tests -v
      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller
      - name: Build background executable
        run: pyinstaller --clean --onefile --noconsole --name Online4TechBridge bridge-package/bridge.py
      - name: Assemble release package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item dist/Online4TechBridge.exe package/
          Copy-Item bridge-package/approved-packages.json package/
          Copy-Item bridge-package/install-windows.ps1 package/
          Copy-Item bridge-package/uninstall-windows.ps1 package/
          Compress-Archive -Path package/* -DestinationPath Online4Tech-Bridge-Windows.zip -Force
          $hash = (Get-FileHash Online4Tech-Bridge-Windows.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  Online4Tech-Bridge-Windows.zip" | Out-File -Encoding ascii SHA256SUMS.txt
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bridge-${{ github.run_number }}
          name: Online4Tech Bridge ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            Online4Tech-Bridge-Windows.zip
            SHA256SUMS.txt
