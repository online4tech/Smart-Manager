name: Build Online4Tech Bridge for Windows

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "bridge-package/**"
      - ".github/workflows/build-bridge-windows.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller
      - name: Build background executable
        run: pyinstaller --clean --onefile --noconsole --name Online4TechBridge bridge-package/bridge.py
      - name: Assemble package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item dist/Online4TechBridge.exe package/
          Copy-Item bridge-package/install-windows.ps1 package/
          Copy-Item bridge-package/uninstall-windows.ps1 package/
          Compress-Archive -Path package/* -DestinationPath Online4Tech-Bridge-Windows.zip -Force
      - name: Upload Windows bridge package
        uses: actions/upload-artifact@v4
        with:
          name: Online4Tech-Bridge-Windows
          path: Online4Tech-Bridge-Windows.zip
          if-no-files-found: error
          retention-days: 30
