<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>مرجع أوامر إنيجما</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky header with search, category rail on the right, command list in the middle, usage + recents panel on the left (RTL, like the reference panel). */
:root {
  --font-head: "Cairo", "Segoe UI", Tahoma, sans-serif;
  --font-body: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --bg: #0d1118;
  --surface: #141a24;
  --surface-2: #1b2331;
  --line: #243044;
  --fg: #e8ecf3;
  --muted: #8f9aad;
  --accent: #e8bd45;
  --accent-ink: #1a1405;
  --accent-soft: rgba(232, 189, 69, 0.13);
  --code-bg: #0a0e14;
  --danger: #f0707a;
  --danger-soft: rgba(240, 112, 122, 0.13);
  --ok: #5dd39e;
  --hh: 76px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #eef1f6; --surface: #ffffff; --surface-2: #f3f5f9; --line: #d8dee9;
    --fg: #121826; --muted: #566175; --accent: #9a6b00; --accent-ink: #ffffff;
    --accent-soft: rgba(154, 107, 0, 0.1); --code-bg: #eef1f6;
    --danger: #b4232f; --danger-soft: rgba(180, 35, 47, 0.09); --ok: #16794f;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #eef1f6; --surface: #ffffff; --surface-2: #f3f5f9; --line: #d8dee9;
  --fg: #121826; --muted: #566175; --accent: #9a6b00; --accent-ink: #ffffff;
  --accent-soft: rgba(154, 107, 0, 0.1); --code-bg: #eef1f6;
  --danger: #b4232f; --danger-soft: rgba(180, 35, 47, 0.09); --ok: #16794f;
  color-scheme: light;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 15px; line-height: 1.6;
  padding-block: 0 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--bg);
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { max-width: 1440px; margin-inline: auto; }

/* header */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); min-height: var(--hh);
  display: flex; align-items: center; gap: 20px; flex-wrap: wrap; padding-block: 14px;
}
.brand { display: flex; flex-direction: column; min-width: 0; }
.brand h1 { margin: 0; font-family: var(--font-head); font-weight: 800; font-size: 1.5rem; line-height: 1.2; text-wrap: balance; }
.brand p { margin: 0; color: var(--muted); font-size: 0.85rem; }
.search { flex: 1 1 320px; max-width: 560px; margin-inline-start: auto; position: relative; }
.search svg { position: absolute; inset-block: 0; inset-inline-start: 14px; margin-block: auto; width: 18px; height: 18px; color: var(--muted); pointer-events: none; }
.search input {
  width: 100%; height: 46px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface); color: var(--fg); font: inherit;
  padding-inline: 44px 44px;
}
.search input::placeholder { color: var(--muted); }
.search input:focus { border-color: var(--accent); outline: none; }
.search .clear {
  position: absolute; inset-block: 0; inset-inline-end: 8px; margin-block: auto; width: 30px; height: 30px;
  border: 0; border-radius: 8px; background: transparent; color: var(--muted); display: none;
}
.search.has-q .clear { display: block; }
.search .clear:hover { background: var(--surface-2); color: var(--fg); }

/* layout */
.layout { display: grid; grid-template-columns: 1fr; gap: 20px; align-items: start; }
@media (min-width: 760px) { .layout { grid-template-columns: 230px minmax(0, 1fr); } .aside { grid-column: 2; } }
@media (min-width: 1100px) { .layout { grid-template-columns: 240px minmax(0, 1fr) 280px; } .aside { grid-column: auto; } }

/* category rail */
.nav { min-width: 0; }
.nav .grp { margin: 0 0 18px; }
.nav h2 { margin: 0 0 6px; padding-inline: 12px; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.06em; color: var(--muted); }
.nav button.cat {
  width: 100%; display: flex; align-items: center; gap: 10px; text-align: start;
  border: 0; border-radius: 10px; background: transparent; padding: 8px 12px; min-height: 44px; position: relative;
}
.nav button.cat:hover { background: var(--surface-2); }
.nav button.cat .ico { width: 28px; height: 28px; flex: none; display: grid; place-items: center; border-radius: 8px; background: var(--surface-2); color: var(--muted); }
.nav button.cat .ico svg { width: 16px; height: 16px; }
.nav button.cat .lb { flex: 1; min-width: 0; font-weight: 500; }
.nav button.cat .ct { font-size: 0.75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.nav button.cat[aria-current="true"] { background: var(--surface); color: var(--accent); }
.nav button.cat[aria-current="true"] .ico { background: var(--accent-soft); color: var(--accent); }
.nav button.cat[aria-current="true"]::after { content: ""; position: absolute; inset-block: 10px; inset-inline-start: 0; width: 3px; border-radius: 3px; background: var(--accent); }
@media (min-width: 760px) {
  .nav { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--hh)); max-height: calc(100vh - var(--hh) - 24px); overflow-y: auto; padding-bottom: 12px; }
}
@media (max-width: 759px) {
  .nav { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--hh)); z-index: 4; background: var(--bg); display: flex; gap: 6px; overflow-x: auto; padding-block: 6px 10px; scrollbar-width: thin; }
  .nav .grp { display: contents; }
  .nav h2 { display: none; }
  .nav button.cat { width: auto; flex: none; border: 1px solid var(--line); background: var(--surface); padding: 6px 12px 6px 10px; border-radius: 999px; min-height: 40px; }
  .nav button.cat .ct { display: none; }
  .nav button.cat .ico { width: 24px; height: 24px; background: transparent; }
  .nav button.cat[aria-current="true"]::after { display: none; }
  .nav button.cat[aria-current="true"] { border-color: var(--accent); }
  .top { gap: 12px; }
}
.searching .nav button.cat[aria-current="true"] { background: transparent; color: inherit; }
.searching .nav button.cat[aria-current="true"] .ico { background: var(--surface-2); color: var(--muted); }
.searching .nav button.cat[aria-current="true"]::after { display: none; }

/* list */
.main { min-width: 0; }
.head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.head h2 { margin: 0; font-family: var(--font-head); font-size: 1.6rem; font-weight: 800; line-height: 1.2; }
.head .en { color: var(--muted); font-size: 0.85rem; direction: ltr; }
.head .sub { flex-basis: 100%; margin: 0; color: var(--muted); font-size: 0.9rem; }
.head .num { margin-inline-start: auto; color: var(--muted); font-size: 0.85rem; font-variant-numeric: tabular-nums; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.chips button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 14px; min-height: 36px; font-size: 0.85rem; }
.chips button:hover { border-color: var(--muted); }
.chips button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.chips .n { opacity: 0.7; margin-inline-start: 6px; font-size: 0.75rem; }
ul.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.row { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; min-width: 0; }
.row:hover { border-color: var(--muted); }
.row.open { border-color: var(--accent); }
.bar { display: flex; align-items: stretch; }
.toggle { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; text-align: start; border: 0; background: transparent; padding: 10px 12px; border-radius: 12px; min-height: 56px; }
.badge { width: 36px; height: 36px; flex: none; display: grid; place-items: center; border-radius: 10px; background: var(--accent-soft); color: var(--accent); font-family: var(--font-mono); font-weight: 500; font-size: 0.95rem; }
.txt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.nm { font-weight: 600; direction: ltr; text-align: start; unicode-bidi: plaintext; overflow-wrap: anywhere; }
.ds { color: var(--muted); font-size: 0.85rem; }
.tag { flex: none; font-size: 0.72rem; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 1px 8px; max-width: 40%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.btn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 6px 14px; min-height: 36px; font-size: 0.85rem; font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { color: var(--accent-ink); filter: brightness(1.08); }
.btn.danger { color: var(--danger); background: var(--danger-soft); border-color: transparent; }
.btn.danger:hover { border-color: var(--danger); color: var(--danger); }
.btn.done { background: var(--ok); border-color: var(--ok); color: #06150e; }
.row .copy { align-self: center; margin-inline: 4px 12px; }
.detail { border-top: 1px solid var(--line); padding: 14px 14px 16px; display: flex; flex-direction: column; gap: 14px; }
.lbl { font-size: 0.75rem; font-weight: 600; color: var(--muted); margin-bottom: 6px; letter-spacing: 0.04em; }
.code { direction: ltr; text-align: left; background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-family: var(--font-mono); font-size: 0.8rem; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; user-select: all; }
.code.rm { border-color: var(--danger-soft); }
.acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.path { direction: ltr; text-align: left; font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted); overflow-wrap: anywhere; }
.warn { margin: 6px 0 0; font-size: 0.8rem; color: var(--muted); }
.empty { border: 1px dashed var(--line); border-radius: 12px; padding: 36px 20px; text-align: center; color: var(--muted); }
.empty strong { display: block; color: var(--fg); font-family: var(--font-head); font-size: 1.1rem; margin-bottom: 4px; }
.where { font-size: 0.72rem; color: var(--muted); }

/* aside */
.aside { min-width: 0; display: flex; flex-direction: column; gap: 14px; }
@media (min-width: 1100px) { .aside { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--hh)); } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
.panel h3 { margin: 0 0 10px; font-size: 0.8rem; font-weight: 600; color: var(--muted); letter-spacing: 0.04em; text-align: center; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; text-align: center; }
.stats b { display: block; font-family: var(--font-head); font-size: 1.7rem; line-height: 1.1; color: var(--accent); font-variant-numeric: tabular-nums; }
.stats span { font-size: 0.8rem; color: var(--muted); }
.steps { margin: 0; padding-inline-start: 20px; display: flex; flex-direction: column; gap: 8px; font-size: 0.88rem; }
.steps li::marker { color: var(--accent); font-weight: 600; }
.steps code { font-family: var(--font-mono); font-size: 0.8rem; direction: ltr; unicode-bidi: isolate; }
.recent { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.recent button { width: 100%; text-align: start; border: 0; background: transparent; border-radius: 8px; padding: 6px 8px; min-height: 36px; display: flex; flex-direction: column; }
.recent button:hover { background: var(--surface-2); }
.recent .nm { font-size: 0.88rem; }
.recent .where { direction: rtl; }
.none { margin: 0; color: var(--muted); font-size: 0.85rem; text-align: center; }
@media (prefers-reduced-motion: no-preference) { .row, .btn, .nav button.cat { transition: border-color 0.15s, background 0.15s; } }
</style>

</head>

<div class="app" id="app" dir="rtl" lang="ar">
  <header class="top">
    <div class="brand">

  <div class="layout" id="layout">

      <div class="chips" id="chips" hidden></div>
      <ul class="list" id="list"></ul>
    </main>
    <aside class="aside" id="aside"></aside>
  </div>
</div>

    'ciefp': { ar: 'إضافات سيف', sub: 'بلجنات Ciefp', ic: 'plug', g: 0 },
    'media': { ar: 'الميديا', sub: 'مشغلات IPTV والصوتيات والراديو', ic: 'play', g: 0 },
    'channels': { ar: 'القنوات', sub: 'ملفات القنوات والترددات', ic: 'tv', g: 1 },
    'skins': { ar: 'السكينات', sub: 'اختيار وتطبيق السكينات حسب نوع الصورة', ic: 'palette', g: 1 },
    'picons': { ar: 'البيكونات', sub: 'شعارات القنوات لكل قمر', ic: 'image', g: 1 },
    'bootlogos': { ar: 'البوت لوجو', sub: 'تغيير شعار الإقلاع', ic: 'power', g: 1 },
    'spinners': { ar: 'الدوارات', sub: 'أيقونات التحميل', ic: 'spin', g: 1 },
    'softcams': { ar: 'السوفتكامات', sub: 'إدارة وتثبيت السوفتكامات', ic: 'key', g: 2 },
    'feeds': { ar: 'الفيدات', sub: 'تحديث وتثبيت الفيدات', ic: 'rss', g: 2 },
    'updated-dependencic': { ar: 'تحديث الحزم', sub: 'حزم أساسية لتشغيل البلجنات', ic: 'refresh', g: 2 },
    'tools': { ar: 'الأدوات', sub: 'أدوات وإصلاحات مفيدة', ic: 'wrench', g: 2 },
    'system': { ar: 'النظام', sub: 'بلجنات النظام', ic: 'term', g: 2 },
    'multiboot': { ar: 'ملتي بوت', sub: 'تشغيل أكثر من صورة على الجهاز', ic: 'layers', g: 2 },
    'images': { ar: 'الصور', sub: 'تحميل الصور', ic: 'disc', g: 3 },
    'backupimages': { ar: 'نسخ الصور', sub: 'بلجنات النسخ الاحتياطي لكل صورة', ic: 'drive', g: 3 },
    'backup': { ar: 'النسخ الاحتياطي', sub: 'حفظ إعدادات الجهاز', ic: 'down', g: 3 },
    'restore': { ar: 'الاسترجاع', sub: 'استرجاع النسخ الاحتياطية', ic: 'up', g: 3 },
    'remove': { ar: 'الحذف', sub: 'حذف الإضافات والملفات', ic: 'trash', g: 3 }
  };
  var GROUPS = ['الإضافات', 'الواجهة والقنوات', 'النظام والكامات', 'الصور والنسخ'];

  function splitName(n) {
    var m = n.match(/^(.*)\s\(([^()]*)\)\s*$/);
    return m ? { name: m[1].trim(), desc: m[2].trim() } : { name: n.trim(), desc: '' };
  }
  var nf = function (x) { return Number(x).toLocaleString('ar-EG'); };
  var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };

  var ALL = {}, TREE = [], BY = {};
  function mk(sectionKey, arr, mainKey, subKey, subTitle) {
    return arr.map(function (it, i) {
      var s = splitName(it.name);
      var o = { id: sectionKey + '.' + i, main: mainKey, sub: subKey, subTitle: subTitle, name: s.name, desc: s.desc, cmd: it.cmd, path: it.path || '', rm: it.remove_cmd || '' };
      ALL[o.id] = o; return o;
    });
  }
  DATA.main.forEach(function (m) {
    var arr = DATA[m.section] || [];
    var node = { key: m.section, title: m.title };
    if (arr.length && arr[0].section) {
      node.subs = arr.map(function (s) { return { key: s.section, title: s.title, items: mk(s.section, DATA[s.section] || [], m.section, s.section, s.title) }; });
      node.items = [].concat.apply([], node.subs.map(function (s) { return s.items; }));
    } else {
      node.items = mk(m.section, arr, m.section, null, '');
    }
    TREE.push(node); BY[node.key] = node;
  });
  var TOTAL = TREE.reduce(function (a, n) { return a + n.items.length; }, 0);

  // haystack for search
  Object.keys(ALL).forEach(function (id) {
    var o = ALL[id], mt = META[o.main] || {};
    o.hay = (o.name + ' ' + o.desc + ' ' + o.cmd + ' ' + o.path + ' ' + o.subTitle + ' ' + (mt.ar || '') + ' ' + o.main).toLowerCase();
  });

  var S = { key: 'favourites', sub: 'all', q: '', open: null };
  var $ = function (id) { return document.getElementById(id); };
  var recent = [];
  try { recent = JSON.parse(localStorage.getItem('enigma-recent') || '[]').filter(function (id) { return ALL[id]; }); } catch (e) { recent = []; }
  function saveRecent(id) {
    recent = [id].concat(recent.filter(function (x) { return x !== id; })).slice(0, 6);
    try { localStorage.setItem('enigma-recent', JSON.stringify(recent)); } catch (e) {}
    renderAside();
  }

  $('tagline').textContent = nf(TOTAL) + ' أمر في ' + nf(TREE.length) + ' قسم، انسخ الأمر بضغطة واحدة';

  function renderNav() {
    var h = '';
    GROUPS.forEach(function (gname, gi) {
      h += '<div class="grp"><h2>' + esc(gname) + '</h2>';
      TREE.forEach(function (n) {
        var m = META[n.key]; if (!m || m.g !== gi) return;
        h += '<button class="cat" type="button" data-key="' + esc(n.key) + '" aria-current="' + (n.key === S.key) + '">' +
          '<span class="ico">' + icon(m.ic) + '</span><span class="lb">' + esc(m.ar) + '</span><span class="ct">' + nf(n.items.length) + '</span></button>';
      });
      h += '</div>';
    });
    $('nav').innerHTML = h;
  }

  function dedupe(items) {
    var seen = {}, out = [];
    items.forEach(function (o) {
      var k = o.name + '|' + o.cmd;
      if (seen[k]) { seen[k].more++; return; }
      var c = Object.assign({}, o, { more: 0 }); seen[k] = c; out.push(c);
    });
    return out;
  }
  function searchItems(q) {
    var toks = q.toLowerCase().split(/\s+/).filter(Boolean);
    var hit = [];
    TREE.forEach(function (n) { n.items.forEach(function (o) { if (toks.every(function (t) { return o.hay.indexOf(t) > -1; })) hit.push(o); }); });
    return dedupe(hit);
  }
  function currentItems() {
    if (S.q) return searchItems(S.q);
    var n = BY[S.key];
    if (n.subs && S.sub !== 'all') { var s = n.subs.filter(function (x) { return x.key === S.sub; })[0]; return s ? s.items : n.items; }
    return n.items;
  }

  function rowHtml(o, showTag) {
    var where = '';
    if (S.q) { var m = META[o.main]; where = (m ? m.ar : o.main) + (o.subTitle ? ' › ' + o.subTitle : '') + (o.more ? ' وفي ' + nf(o.more) + ' أقسام أخرى' : ''); }
    var tag = (!S.q && showTag && o.subTitle) ? '<span class="tag">' + esc(o.subTitle) + '</span>' : '';
    return '<li class="row" data-id="' + esc(o.id) + '"><div class="bar">' +
      '<button class="toggle" type="button" data-act="toggle" aria-expanded="false">' +
      '<span class="badge" aria-hidden="true">' + esc(o.name.charAt(0).toUpperCase()) + '</span>' +
      '<span class="txt"><span class="nm">' + esc(o.name) + '</span>' +
      (o.desc ? '<span class="ds">' + esc(o.desc) + '</span>' : '') +
      (where ? '<span class="where">' + esc(where) + '</span>' : '') + '</span>' + tag + '</button>' +
      '<button class="btn copy" type="button" data-act="copy">نسخ الأمر</button></div>' +
      '<div class="detail" hidden></div></li>';
  }
  function detailHtml(o) {
    var h = '<div><div class="lbl">أمر التثبيت</div><div class="code">' + esc(o.cmd) + '</div>' +
      '<div class="acts"><button class="btn primary" type="button" data-act="copy">نسخ الأمر</button></div></div>';
    if (o.path) h += '<div><div class="lbl">مسار الملفات على الجهاز</div><div class="path">' + esc(o.path) + '</div></div>';
    if (o.rm) h += '<div><div class="lbl">أمر الحذف</div><div class="code rm">' + esc(o.rm) + '</div>' +
      '<div class="acts"><button class="btn danger" type="button" data-act="copy-rm">نسخ أمر الحذف</button></div>' +
      '<p class="warn">أمر الحذف يمسح الملفات من الجهاز ولا يمكن التراجع عنه.</p></div>';
    return h;
  }

  function renderList() {
    var box = $('layout'); box.classList.toggle('searching', !!S.q);
    $('searchbox').classList.toggle('has-q', !!S.q);
    var items = currentItems(), n = BY[S.key], m = META[S.key];
    var head = '';
    if (S.q) {
      head = '<h2>نتائج البحث</h2><span class="en">' + esc(S.q) + '</span><span class="num">' + nf(items.length) + ' نتيجة</span>';
      $('chips').hidden = true;
    } else {
      head = '<h2>' + esc(m.ar) + '</h2><span class="en">' + esc(n.title) + '</span><span class="num">' + nf(items.length) + ' عنصر</span><p class="sub">' + esc(m.sub) + '</p>';
      if (n.subs) {
        var c = '<button type="button" data-sub="all" aria-pressed="' + (S.sub === 'all') + '">الكل<span class="n">' + nf(n.items.length) + '</span></button>';
        n.subs.forEach(function (s) { c += '<button type="button" data-sub="' + esc(s.key) + '" aria-pressed="' + (S.sub === s.key) + '">' + esc(s.title) + '<span class="n">' + nf(s.items.length) + '</span></button>'; });
        $('chips').innerHTML = c; $('chips').hidden = false;
      } else { $('chips').hidden = true; }
    }
    $('head').innerHTML = head;
    if (!items.length) {
      $('list').innerHTML = '<li class="empty"><strong>لا توجد نتائج</strong>جرّب اسم البلجن بالإنجليزي أو كلمة من وصفه مثل «سكين» أو «قنوات».</li>';
    } else {
      $('list').innerHTML = items.map(function (o) { return rowHtml(o, !!n.subs); }).join('');
    }
    S.open = null;
  }

  function renderAside() {
    var h = '<div class="panel"><h3>ملخص</h3><div class="stats"><div><b>' + nf(TOTAL) + '</b><span>أمر</span></div><div><b>' + nf(TREE.length) + '</b><span>قسم</span></div></div></div>';
    h += '<div class="panel"><h3>طريقة الاستخدام</h3><ol class="steps">' +
      '<li>ادخل على الجهاز بـ SSH أو Telnet بالمستخدم <code>root</code>.</li>' +
      '<li>انسخ الأمر من هنا والصقه في الشاشة واضغط Enter.</li>' +
      '<li>بعد التثبيت أعد تشغيل الواجهة أو الجهاز لو احتاج.</li></ol></div>';
    h += '<div class="panel"><h3>آخر ما نسخته</h3>';
    if (recent.length) {
      h += '<ul class="recent">' + recent.map(function (id) {
        var o = ALL[id], m = META[o.main];
        return '<li><button type="button" data-jump="' + esc(id) + '"><span class="nm">' + esc(o.name) + '</span><span class="where">' + esc((m ? m.ar : '') + (o.subTitle ? ' › ' + o.subTitle : '')) + '</span></button></li>';
      }).join('') + '</ul>';
    } else { h += '<p class="none">ستظهر هنا الأوامر التي تنسخها.</p>'; }
    h += '</div>';
    $('aside').innerHTML = h;
  }

  function fallbackCopy(t, node) {
    var ta = document.createElement('textarea'); ta.value = t; ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0'; document.body.appendChild(ta); ta.select();
    var ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
    ta.remove();
    if (!ok && node) { var r = document.createRange(); r.selectNodeContents(node); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); }
    return ok;
  }
  function flash(btn, ok) {
    var old = btn.getAttribute('data-old') || btn.textContent; btn.setAttribute('data-old', old);
    btn.textContent = ok ? 'تم النسخ' : 'ظلّل الأمر وانسخه'; btn.classList.add('done');
    clearTimeout(btn._t); btn._t = setTimeout(function () { btn.textContent = old; btn.classList.remove('done'); }, 1600);
  }
  function doCopy(text, btn, id, node) {
    var done = function (ok) { flash(btn, ok); if (ok && id) saveRecent(id); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(fallbackCopy(text, node)); });
    } else { done(fallbackCopy(text, node)); }
  }
  function setOpen(li, open) {
    var d = li.querySelector('.detail'), b = li.querySelector('.toggle');
    if (open && !d.firstChild) d.innerHTML = detailHtml(ALL[li.getAttribute('data-id')]);
    d.hidden = !open; li.classList.toggle('open', open); b.setAttribute('aria-expanded', String(open));
  }

  $('list').addEventListener('click', function (e) {
    var btn = e.target.closest('[data-act]'); if (!btn) return;
    var li = btn.closest('.row'), id = li.getAttribute('data-id'), o = ALL[id], act = btn.getAttribute('data-act');
    if (act === 'toggle') {
      var willOpen = S.open !== id;
      if (S.open) { var prev = $('list').querySelector('.row[data-id="' + S.open + '"]'); if (prev) setOpen(prev, false); }
      setOpen(li, willOpen); S.open = willOpen ? id : null;
    } else if (act === 'copy') {
      if (!li.classList.contains('open')) { setOpen(li, true); if (S.open && S.open !== id) { var p2 = $('list').querySelector('.row[data-id="' + S.open + '"]'); if (p2) setOpen(p2, false); } S.open = id; }
      doCopy(o.cmd, btn, id, li.querySelector('.code'));
    } else if (act === 'copy-rm') {
      doCopy(o.rm, btn, null, li.querySelector('.code.rm'));
    }
  });
  $('nav').addEventListener('click', function (e) {
    var b = e.target.closest('[data-key]'); if (!b) return;
    S.q = ''; $('q').value = ''; S.sub = 'all'; S.key = b.getAttribute('data-key');
    if (location.hash !== '#' + S.key) { location.hash = S.key; }
    renderNav(); renderList(); window.scrollTo({ top: 0 });
  });
  $('chips').addEventListener('click', function (e) {
    var b = e.target.closest('[data-sub]'); if (!b) return;
    S.sub = b.getAttribute('data-sub'); renderList();
  });
  $('aside').addEventListener('click', function (e) {
    var b = e.target.closest('[data-jump]'); if (!b) return;
    var o = ALL[b.getAttribute('data-jump')];
    S.q = ''; $('q').value = ''; S.key = o.main; S.sub = o.sub || 'all';
    if (location.hash !== '#' + S.key) { location.hash = S.key; }
    renderNav(); renderList();
    var li = $('list').querySelector('.row[data-id="' + o.id + '"]');
    if (li) { setOpen(li, true); S.open = o.id; li.scrollIntoView({ block: 'center' }); }
  });
  $('q').addEventListener('input', function () { S.q = this.value.trim(); renderNav(); renderList(); });
  $('q').addEventListener('keydown', function (e) { if (e.key === 'Escape') { this.value = ''; S.q = ''; renderNav(); renderList(); } });
  $('qclear').addEventListener('click', function () { $('q').value = ''; S.q = ''; renderNav(); renderList(); $('q').focus(); });

  function fromHash() {
    var k = decodeURIComponent((location.hash || '').replace('#', ''));
    if (BY[k] && (k !== S.key || S.q)) { S.key = k; S.sub = 'all'; S.q = ''; $('q').value = ''; renderNav(); renderList(); }
  }
  window.addEventListener('hashchange', fromHash);
  var k0 = decodeURIComponent((location.hash || '').replace('#', ''));
  if (BY[k0]) S.key = k0;
  renderNav(); renderList(); renderAside();
})();
</script>
</body>
</html>
